[project]
name = "nguyenpanda-httpd"
version = "0.1.0"
description = "A lightweight HTTP server implementation for nguyenpanda.com, demonstrating raw socket programming without frameworks."
authors = [
    { name = "Tuong Nguyen Ha", email = "hatuongnguyen@0107gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "nguyenpanda>=1.0.0",
    "nguyenpanda-config>=0.1.1",
    "psutil>=7.2.1",
    "pyyaml>=6.0.3",
    "typing-extensions>=4.15.0",
]

# No [tool.uv.workspace] here on purpose. Declaring one made this package its
# own workspace root, which collides with the parent site's workspace when it
# is checked out as a submodule -- and the documented workaround was to delete
# the section by hand after every clone, leaving the submodule permanently
# modified. The parent declares the workspace; standalone use needs no such
# declaration, since uv installs the project itself in editable mode anyway.
#
# The self-referential dev dependency went with it: a package does not need to
# depend on itself, and `workspace = true` had nothing left to resolve against.

[dependency-groups]
dev = [
    "pylint[spelling]>=4.0.4",
]
